schema = 1
id = "sunsunshader"
name = "Sunsun Shader"
version = "0.1.0"
api = "0.2"
description = "Warm light, cool shade and weathered air."
authors = ["lkjsxc"]
license = "Apache-2.0"
shared = ["shaders/options.wgsl", "shaders/atmosphere.wgsl", "shaders/clouds.wgsl", "shaders/lighting.wgsl", "shaders/fog.wgsl"]

[frame]
blend = "linear"
fog = "pack"

[sky]
file = "shaders/sky.wgsl"
sun = false
stars = false
clouds = false

[material]
file = "shaders/material.wgsl"
files = ["shaders/shadows.wgsl", "shaders/water.wgsl"]

[entity]
file = "shaders/entity.wgsl"
files = ["shaders/shadows.wgsl"]

[[post]]
file = "shaders/air.wgsl"
files = ["shaders/shadows.wgsl"]
name = "Air"

[tonemap]
file = "shaders/tonemap.wgsl"

[[options]]
id = "quality"
name = "Profile"
description = "Low, Medium, High or Ultra sampling; Medium is the default."
type = "choice"
values = ["Low", "Medium", "High", "Ultra"]
default = "Medium"

[[options]]
id = "exposure"
name = "Exposure"
description = "Adjust overall brightness without changing the light colours."
type = "float"
default = 1.0
min = 0.5
max = 1.8
step = 0.05

[[options]]
id = "haze"
name = "Air density"
description = "Set the amount of atmospheric haze and low fog."
type = "float"
default = 1.0
min = 0.5
max = 1.8
step = 0.1

[[tags]]
id = "foliage"
sprites = ["block/*_leaves", "block/short_grass", "block/tall_grass_*", "block/fern", "block/large_fern_*", "block/vine"]

[[tags]]
id = "ore"
sprites = ["block/*_ore"]

[[lights]]
color = [1.0, 0.64, 0.32]
blocks = ["torch", "wall_torch", "lantern", "campfire", "*candle*", "jack_o_lantern"]

[[lights]]
color = [0.32, 0.76, 1.0]
blocks = ["soul_torch", "soul_wall_torch", "soul_lantern", "soul_campfire"]

[[lights]]
color = [1.0, 0.43, 0.12]
blocks = ["lava", "fire", "magma_block"]

[[lights]]
color = [1.0, 0.22, 0.10]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_lamp", "redstone_ore", "deepslate_redstone_ore"]

[[lights]]
color = [1.0, 0.88, 0.62]
blocks = ["glowstone", "shroomlight", "ochre_froglight"]

[[lights]]
color = [0.61, 0.88, 0.94]
blocks = ["sea_lantern", "end_rod"]

[[lights]]
color = [0.81, 0.68, 1.0]
blocks = ["pearlescent_froglight", "amethyst_cluster", "large_amethyst_bud"]

[shadow]
resolution = 1536
distance = 128.0
option = "shadows"

[ray_tracing]

[[options]]
id = "shadows"
name = "Shadows"
description = "Draw filtered sun and moon shadows."
type = "bool"
default = true

[[options]]
id = "water_reflections"
name = "Terrain reflections"
description = "Reflect terrain in water using the screen or available ray queries."
type = "bool"
default = true

[[options]]
id = "clouds"
name = "Clouds"
description = "Draw low cloud volumes, thin high clouds and their shade."
type = "bool"
default = true

[[options]]
id = "weather_detail"
name = "Weather detail"
description = "Add wet surfaces, a cold snow coat, clearing-rain bows and faint auroras."
type = "bool"
default = true

[budget]
# Medium target at 1920x1080; no hardware timing is available yet.
gpu_ms = 4.0
