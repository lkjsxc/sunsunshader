schema = 1
id = "sunsunshader"
name = "Sunsun Shader"
version = "0.2.0-rc5"
api = "0.2"
description = "Warm light, cool shade and weathered air."
authors = ["lkjsxc"]
license = "Apache-2.0"
shared = ["shaders/compat.wgsl", "shaders/options.wgsl", "shaders/atmosphere.wgsl", "shaders/clouds.wgsl", "shaders/lighting.wgsl", "shaders/fog.wgsl"]


# Preserve rc3 transparent blending; API 0.2 stages still read/write linear light.
[frame]
blend = "gamma"
primaries = "bt709"
fog = "pack"

# Existing paired view targets: bloom data and additive haze plus endpoint distance.
# World observations live only in the explicitly keyed buffers below.
[[resource]]
name = "ss_bright"
format = "rgba16float"
scale = 0.25
keep = "view"

[[resource]]
name = "ss_blur"
format = "rgba16float"
scale = 0.25
keep = "view"

[[resource]]
name = "ss_bloom"
format = "rgba16float"
scale = 0.25
keep = "view"

[[resource]]
name = "ss_haze"
format = "rgba16float"
scale = 0.25
keep = "view"

[[resource]]
name = "ss_emitter_halo"
format = "rgba16float"
scale = 0.25
keep = "view"

[kept]
# Native lifecycle clears world resources on a camera jump farther than64 blocks.
reach = 64

[[resource]]
name = "ss_world_light"
buffer = 19923008
element = "vec4<u32>"
keep = "world"

[[resource]]
name = "ss_light_accum"
buffer = 13107264
element = "atomic<u32>"
keep = "world"

[[before_world]]
file = "shaders/haze_clear.wgsl"
files = ["shaders/haze_protocol.wgsl"]
dispatch = [32, 32, 32]
workgroup = [4, 4, 4]
reads = ["ss_world_light"]
writes = ["ss_light_accum"]

[sky]
file = "shaders/sky.wgsl"
sun = false
stars = false
clouds = false

[material]
file = "shaders/material.wgsl"
files = ["shaders/shadows.wgsl", "shaders/water.wgsl", "shaders/haze_codec.wgsl"]


[vertex]
file = "shaders/vertex.wgsl"

[[post]]
file = "shaders/haze_observe.wgsl"
files = ["shaders/haze_protocol.wgsl", "shaders/haze_codec.wgsl"]
name = "Observe native receiver light"
compute = true
dispatch = "pixels"
workgroup = [8, 8, 1]
writes = ["ss_light_accum"]

[[post]]
file = "shaders/haze_resolve.wgsl"
files = ["shaders/haze_protocol.wgsl", "shaders/haze_codec.wgsl"]
name = "Resolve world light observations"
compute = true
dispatch = [32, 32, 32]
workgroup = [4, 4, 4]
reads = ["ss_light_accum"]
writes = ["ss_world_light"]

[[post]]
file = "shaders/haze_air_field.wgsl"
files = ["shaders/haze_protocol.wgsl"]
name = "Reconstruct observed light in air"
compute = true
dispatch = [32, 32, 32]
workgroup = [4, 4, 4]
writes = ["ss_world_light"]

[[post]]
file = "shaders/haze_scatter.wgsl"
files = ["shaders/haze_protocol.wgsl"]
name = "Integrate world light haze"
compute = true
dispatch = "pixels"
workgroup = [8, 8, 1]
reads = ["ss_world_light"]
writes = ["ss_haze", "ss_emitter_halo"]

[[post]]
file = "shaders/air.wgsl"
reads = ["ss_haze", "ss_emitter_halo"]
files = ["shaders/shadows.wgsl", "shaders/lunar_air.wgsl", "shaders/haze_codec.wgsl"]
name = "Air"

[[post]]
file = "shaders/bloom_seed.wgsl"
name = "Bloom seed"
output = "ss_bright"

[[post]]
file = "shaders/bloom_horizontal.wgsl"
reads = ["ss_bright"]
name = "Bloom horizontal"
output = "ss_blur"

[[post]]
file = "shaders/bloom_vertical.wgsl"
reads = ["ss_blur"]
name = "Bloom vertical"
output = "ss_bloom"

[[post]]
file = "shaders/compose.wgsl"
reads = ["ss_bloom"]
name = "Bloom and camera motion"

[[post]]
file = "shaders/focus.wgsl"
name = "Optional focus"

[[post]]
file = "shaders/lens.wgsl"
name = "Edge resolve"

[weather]
file = "shaders/weather.wgsl"

[[post]]
file = "shaders/tonemap.wgsl"
name = "Filmic output"

# The existing curve stays the last post, retaining its window-resolution sampling.
# Display mapping is identity; Horizon performs output encoding exactly once.
[tonemap]
file = "shaders/display.wgsl"

[[options]]
id = "quality"
name = "Profile"
description = "Low, Medium or High sampling; Medium is the default."
type = "choice"
values = ["Low", "Medium", "High"]
default = "Medium"

[[options]]
id = "exposure"
name = "Exposure"
description = "Adjust overall brightness without changing the light colours."
type = "float"
default = 1.0
min = 0.5
max = 1.8
step = 0.05

[[options]]
id = "haze"
name = "Air density"
description = "Set the amount of atmospheric haze and low fog."
type = "float"
default = 1.0
min = 0.5
max = 1.8
step = 0.1

[[options]]
id = "local_haze"
name = "Light in the air"
description = "Scatter visible lights in damp or enclosed air on Medium and High."
type = "bool"
default = true

[[tags]]
id = "foliage"
sprites = ["block/*_leaves", "block/short_grass", "block/tall_grass_*", "block/fern", "block/large_fern_*", "block/vine", "block/wheat_stage*", "block/carrots_stage*", "block/potatoes_stage*", "block/beetroots_stage*"]

[[tags]]
id = "ore"
sprites = ["block/*_ore"]

# Tag mask 4u (index 2): the old renderer excluded this sprite from shader emission.
[[tags]]
id = "rc3_non_emitting_lichen"
sprites = ["block/glow_lichen"]

# Tag mask 8u (index 3) identifies the trial cage's model sprites.
[[tags]]
id = "trial_spawner_cage"
sprites = ["block/trial_spawner_*"]

[[lights]]
color = [1.0, 0.64, 0.32]
blocks = ["torch", "wall_torch", "lantern", "campfire", "*candle*", "jack_o_lantern"]

[[lights]]
color = [0.32, 0.76, 1.0]
blocks = ["soul_torch", "soul_wall_torch", "soul_lantern", "soul_campfire"]

[[lights]]
color = [1.0, 0.43, 0.12]
blocks = ["lava", "fire", "magma_block"]

[[lights]]
color = [1.0, 0.22, 0.10]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_lamp", "redstone_ore", "deepslate_redstone_ore"]

[[lights]]
color = [1.0, 0.88, 0.62]
blocks = ["glowstone", "shroomlight", "ochre_froglight"]

[[lights]]
color = [0.61, 0.88, 0.94]
blocks = ["sea_lantern", "end_rod"]

[[lights]]
color = [0.81, 0.68, 1.0]
blocks = ["pearlescent_froglight", "amethyst_cluster", "large_amethyst_bud"]

[shadow]
resolution = 1536
distance = 128.0
option = "shadows"


[[options]]
id = "shadows"
name = "Shadows"
description = "Draw filtered sun and moon shadows."
type = "bool"
default = true

[[options]]
id = "water_reflections"
name = "Terrain reflections"
description = "Reflect visible terrain in water; sky reflection remains when off."
type = "bool"
default = true


[[options]]
id = "water_waves"
name = "Wave strength"
description = "Adjust the surface waves; zero gives a calm surface."
type = "float"
default = 1.0
min = 0.0
max = 1.5
step = 0.1

[[options]]
id = "clouds"
name = "Clouds"
description = "Draw low cloud volumes, thin high clouds and their shade."
type = "bool"
default = true

[[options]]
id = "weather_detail"
name = "Weather detail"
description = "Add wet surfaces, a light snow coat, rainbows and faint auroras."
type = "bool"
default = true

[[options]]
id = "bloom"
name = "Bloom"
description = "Set the strength of the soft glow around bright light."
type = "float"
default = 0.10
min = 0.0
max = 0.30
step = 0.02

[[options]]
id = "depth_of_field"
name = "Depth of field"
description = "Focus at the centre of the screen; off by default."
type = "bool"
default = false

[[options]]
id = "camera_motion_blur"
name = "Camera motion blur"
description = "Blur camera movement; object motion is not available."
type = "bool"
default = false

[[options]]
id = "vignette"
name = "Vignette"
description = "Dim the outer corners slightly; off by default."
type = "bool"
default = false

[[pages]]
id = "main"
name = "Sunsun Shader"
items = ["quality", "exposure", "clouds", "shadows", "haze", "local_haze", "water_reflections", "water_waves", "weather_detail", "contact_shading", "wind", "light_shafts", "bloom", "page:camera"]

[[pages]]
id = "camera"
name = "Camera"
description = "Optional camera effects, all off by default."
items = ["depth_of_field", "camera_motion_blur", "vignette"]

[budget]
# Medium target at 1920x1080; no hardware timing is available yet.
gpu_ms = 4.0

[[materials]]
id = 10
sprites = ["block/*_leaves"]

[[materials]]
id = 11
sprites = ["block/short_grass", "block/fern", "block/wheat_stage*", "block/carrots_stage*", "block/potatoes_stage*", "block/beetroots_stage*"]

[[materials]]
id = 12
sprites = ["block/tall_grass_bottom", "block/large_fern_bottom"]

[[materials]]
id = 13
sprites = ["block/tall_grass_top", "block/large_fern_top"]

[[options]]
id = "contact_shading"
name = "Contact shade"
description = "Darken nearby corners and overhangs on Medium and High."
type = "bool"
default = true

[[options]]
id = "wind"
name = "Plant wind"
description = "Gently move leaves, grass and crops together with their shadows."
type = "bool"
default = true

[[options]]
id = "light_shafts"
name = "Light shafts"
description = "On High, scatter sunlight through real shadow-map openings."
type = "bool"
default = true
