name: Check released Horizon compatibility

on:
  push:
    branches: [main]
    paths: ["pack/**", "pack-main/**", "tools/**", "compatibility/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["pack/**", "pack-main/**", "tools/**", "compatibility/**", ".github/workflows/check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache pinned validator builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/horizon-nightly/target
            .build/horizon-main/target
          key: sunsun-released-validators-${{ runner.os }}-${{ hashFiles('compatibility/horizon.json') }}
      - name: Build and check the actual archives
        run: python3 tools/release.py check --self-test
      - name: Keep checked archives and admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: checked-shader-packs
          path: dist/*
          if-no-files-found: error
