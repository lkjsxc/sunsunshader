name: Check released Horizon compatibility

on:
  push:
    branches: [main]
    paths: ["pack/**", "tools/**", "compatibility/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["pack/**", "tools/**", "compatibility/**", ".github/workflows/check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache pinned validator and continuity builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/horizon-validator
            .build/post-ir/target
          key: sunsun-nightly-validator-${{ runner.os }}-${{ hashFiles('compatibility/horizon.json') }}
      - name: Build and check the archive
        run: python3 tools/release.py check --self-test
      - name: Check post continuity and historical refusals
        run: python3 -m unittest discover -s tools -p 'test_post_continuity.py' -v
      - name: Check native timing fixtures
        run: python3 -m unittest discover -s tools -p 'test_gallery_timing.py' -v
      - name: Keep the checked archive and admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: checked-shader-packs
          path: dist/*
          if-no-files-found: error
